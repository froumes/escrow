name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustc builds after 2026-08-18 (incl. current stable) break azalea-core's
      # FixedBitSet<const N> with E0284. Pin the last good nightly until upstream fixes it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-19
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets

  linux-el9:
    name: Linux glibc 2.34 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check AlmaLinux 9 binaries
        run: |
          bash .github/scripts/build-linux-el9.sh
          test -s target/x86_64-unknown-linux-gnu/release/twm
          test -s target/x86_64-unknown-linux-gnu/release/TWM-loader
